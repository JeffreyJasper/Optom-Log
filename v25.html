<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Clinical Supervisor Log V25</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--text:#fff;--muted:#a0a0a8;--red:#ff453a;--green:#32d74b;--orange:#ff9f0a;--border:#333;--theme:#0a84ff;--dark:#002b5e}body[data-s="2"]{--theme:#32d74b;--dark:#0a3814}body[data-s="3"]{--theme:#bf5af2;--dark:#32004f}body[data-s="4"]{--theme:#ff9f0a;--dark:#4d2e00}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;overflow-x:hidden}button,input,textarea,select{font:inherit}input,textarea,select{font-size:16px}.app{max-width:520px;min-height:100vh;margin:auto}.bar,.row,.tabs,.actions{display:flex;gap:7px}.bar{padding:8px;border-bottom:1px solid var(--border)}.bar input{flex:1;min-width:0}.b,.tab,.pill,.btn{border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:8px;padding:10px;font-weight:700}.b.active,.tab.active,.btn.primary{background:var(--theme);color:#fff;border-color:var(--theme)}.nav{position:sticky;top:0;z-index:10;background:#000}.tabs{border-bottom:1px solid var(--border)}.tab{flex:1;border:0;border-radius:0;background:none}.tab.active{border-bottom:3px solid var(--theme);background:#121212}.ptabs{padding:6px 8px}.pill{flex:1;border-radius:20px}.pill.active{background:#444;color:#fff}.banner{padding:7px;text-align:center;background:var(--dark);border-bottom:1px solid var(--theme);font-weight:700}.banner small{display:block;font-weight:400;opacity:.9}.section{padding:8px;border-bottom:1px solid var(--border)}.inp,.txt,.sel{background:#000;color:#fff;border:1px solid var(--border);border-radius:7px;padding:9px;min-width:0}.inp{flex:1}.txt{width:100%;min-height:62px;resize:vertical;margin:5px 0}.row{margin-bottom:7px}.timers{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.timer{background:var(--card);padding:5px;border-radius:8px;text-align:center}.timer label{display:block;color:var(--muted);font-size:12px}.timer input{width:100%;background:transparent;color:#fff;border:0;text-align:center;color-scheme:dark}.wide{width:100%;margin-top:7px}.wide.done{color:var(--green);border-color:var(--green)}.wide.cancel{color:var(--orange);border-color:var(--orange)}.mode{padding:8px}.rxh,.rxr{display:grid;grid-template-columns:32px repeat(4,1fr);gap:5px;margin:5px 8px}.rxh{text-align:center;color:var(--muted);font-size:12px}.cell{height:44px;border:2px solid var(--border);background:var(--card);border-radius:6px;display:flex;align-items:center;justify-content:center;font:700 17px monospace}.cell.active{border-color:var(--theme);background:#1a2a3a}.pad{display:grid;grid-template-columns:1fr 1fr 1fr 1.2fr;gap:6px;padding:8px}.key{height:46px;border:0;border-radius:8px;background:#2c2c2e;color:#fff;font-size:20px}.key.dec{color:var(--theme);font-size:16px;font-weight:700}.content{padding:8px}.title{font-weight:800;margin:14px 0 5px}.err,.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:9px}.sev,.scores{display:flex;gap:4px}.sev button,.scores button{flex:1;min-width:0;padding:9px 0;border:1px solid #444;background:#111;color:var(--muted);border-radius:4px}.sev button.on{background:#5a0000;color:#fff;border-color:var(--red)}.scores button.on{background:var(--theme);color:#fff}.overall{padding:8px;background:#12331a;color:var(--green);border-radius:6px}.overall.fail{background:#3a1515;color:#ff6b6b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);overflow:auto}.modal.show{display:block}.box{max-width:520px;min-height:100%;margin:auto;background:#121212;padding:14px}.box h3{color:var(--theme);margin:18px 0 6px}.preview{white-space:pre-wrap;background:#000;border:1px solid var(--border);padding:10px;border-radius:7px;margin:8px 0}.toast{display:none;position:fixed;z-index:99;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;font-weight:700;max-width:90%;text-align:center}.muted{color:var(--muted);font-size:12px}.hidden{display:none!important}
</style></head>
<body data-s="1"><div class="app">
<div class="bar"><input class="inp" type="date" id="date"><button class="b active" id="am" onclick="setSession('AM')">☀️ AM</button><button class="b" id="pm" onclick="setSession('PM')">🌙 PM</button><button class="b" onclick="openSettings()">⚙️</button></div>
<div class="nav"><div class="tabs" id="stabs"></div><div class="tabs ptabs" id="ptabs"></div><div class="banner" id="banner"></div></div>
<div class="section"><div class="row"><input class="inp" id="sname" placeholder="Student name" oninput="studentChanged()"><input class="inp" id="group" style="flex:0 0 90px" placeholder="Group" oninput="studentChanged()"></div><div class="row"><input class="inp" id="pid" placeholder="Patient ID" oninput="infoChanged()"></div><div class="muted" id="code"></div><div class="row"><input class="inp" id="age" type="number" placeholder="Age" oninput="infoChanged()"><button class="b" id="gm" onclick="gender('M')">M</button><button class="b" id="gf" onclick="gender('F')">F</button></div><textarea class="txt" id="hx" placeholder="Previous Hx (no names / phone / HKID)" oninput="P().hx=this.value;save()"></textarea><div class="timers" id="timers"></div><div class="muted" id="duration"></div><button class="b wide" id="noshow" onclick="toggleNoShow()"></button></div>
<div id="clinical"><div class="tabs mode"><button class="b" id="lensbtn" onclick="mode='lens';render()">Lensometry</button><button class="b" id="rxbtn" onclick="mode='rx';render()">Supervisor Rx</button></div><div class="rxh"><div></div><div>SPH</div><div>CYL</div><div>AXIS</div><div>ADD</div></div><div id="rxrows"></div><div class="pad" id="pad"></div>
<div class="content"><div class="title" style="color:#0a84ff">👁️ My Clinical Observations</div><textarea class="txt" id="obs" oninput="P().obs=this.value;save()"></textarea><div class="title" style="color:#ff9f0a">⚠️ Clinical Errors & Deductions</div><div id="errors"></div><div class="card"><div class="title" style="color:#32d74b;margin-top:0">📊 Grading (1–9, Base 8, Fail ≤4)</div><div id="grading"></div><div class="overall" id="overall"></div><textarea class="txt" id="note" placeholder="Additional overall comments" oninput="P().note=this.value;save()"></textarea><button class="b wide" id="done" onclick="P().done=!P().done;save();render()"></button><div class="grid" style="margin-top:8px"><button class="btn primary" onclick="copyReport()">📋 Copy Summary</button><button class="btn" onclick="shareReport()">📤 Share</button><button class="btn" onclick="downloadReport()">💾 Download .txt</button><button class="btn" onclick="exportBackup()">💾 Backup .json</button></div></div></div></div></div>
<div class="modal" id="settings"><div class="box"><div class="row" style="justify-content:space-between"><b style="font-size:18px">⚙️ Settings</b><button class="b" onclick="closeSettings()">Close ✕</button></div><h3>🔁 Case Assignment (before examination only)</h3><p class="muted">逐個 case 鎖定。正在記錄 Patient 1 時，仍可調動未開始的 Patient 2。Move/Swap 完成後會保留目前畫面位置。</p><div class="row"><select class="sel" id="action" onchange="assignmentPreview()"><option value="move">Move Case</option><option value="swap">Swap Cases</option><option value="cancel">Mark Cancelled</option><option value="walkin">Replace/Add Walk-in</option></select></div><div class="row"><select class="sel" id="fromS" onchange="assignmentPreview()"></select><select class="sel" id="fromP" onchange="assignmentPreview()"></select></div><div class="row" id="toRow"><select class="sel" id="toS" onchange="assignmentPreview()"></select><select class="sel" id="toP" onchange="assignmentPreview()"></select></div><div class="preview" id="assignPreview"></div><button class="btn primary wide" id="applyAssign" onclick="applyAssignment()">Apply</button><h3>👥 Student 4</h3><button class="b" onclick="roster.show4=!roster.show4;saveRoster();fillAssignment();render()">Show / Hide Student 4</button><h3>💾 Import backup</h3><input type="file" id="restore" accept=".json,application/json" onchange="importBackup(this)"><h3>🗑 Session reset</h3><button class="b wide" style="color:var(--red)" onclick="resetSession()">Reset current date and session</button></div></div><div class="toast" id="toast"></div>
<script>
const $=x=>document.getElementById(x),pad=n=>String(n).padStart(2,'0');
const APP_VERSION=25,SCHEMA_VERSION=25,PFX='optom_v25_';
const domains=['prelim','comm','prof','fluency','accuracy'],labels={prelim:'Preliminary',comm:'Communication',prof:'Proficiency',fluency:'Fluency',accuracy:'Accuracy'};
const errDefs={'1. History & Workflow':['comm','fluency'],'2. Preliminary Tests':['prelim'],'3. Refraction':['prof','accuracy'],'4. Anterior Seg & Tono':['prof','accuracy'],'5. Post Seg & Glaucoma':['prof','accuracy'],'6. Dx, Mgmt & Record':['prof'],'7. Professionalism':['comm','fluency']},cats=Object.keys(errDefs);
let curDate=today(),session='AM',s=1,p=1,mode='lens',eye='OD',field='sph',db={},roster={};
function today(){let d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function baseRx(){return{sph:'+',cyl:'-',axis:'',add:'+'}}
function patient(){let x={pid:'',age:'',gender:'',hx:'',status:'scheduled',replacementOf:'',times:{start:null,check:null,end:null},lens:{OD:baseRx(),OS:baseRx()},rx:{OD:baseRx(),OS:baseRx()},obs:'',errors:{},manual:{},note:'',done:false};cats.forEach(c=>x.errors[c]={text:'',sev:0});return x}
function norm(o){let n=patient();if(o&&typeof o==='object')Object.assign(n,o);n.times=Object.assign({start:null,check:null,end:null},o?.times||{});n.lens=Object.assign({OD:baseRx(),OS:baseRx()},o?.lens||{});n.rx=Object.assign({OD:baseRx(),OS:baseRx()},o?.rx||{});n.errors=n.errors||{};cats.forEach(c=>n.errors[c]=Object.assign({text:'',sev:0},n.errors[c]||{}));n.manual=n.manual||{};return n}
function key(){return PFX+'day_'+curDate.replaceAll('-','')+'_'+session}function rkey(){return PFX+'roster_'+session}
function load(){let o={};try{o=JSON.parse(localStorage.getItem(key()))||{}}catch(e){}for(let i=1;i<=4;i++){o[i]=o[i]||{};for(let j=1;j<=3;j++)o[i][j]=norm(o[i][j])}db=o;try{roster=JSON.parse(localStorage.getItem(rkey()))||{}}catch(e){roster={}}roster.names=Object.assign({1:'',2:'',3:'',4:''},roster.names||{});roster.groups=Object.assign({1:'',2:'',3:'',4:''},roster.groups||{});roster.show4=!!roster.show4}
function save(){try{localStorage.setItem(key(),JSON.stringify(db))}catch(e){toast('⚠ 儲存失敗')}}function saveRoster(){localStorage.setItem(rkey(),JSON.stringify(roster))}function P(){return db[s][p]}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.display='none',3200)}
function emptyRx(r){return['OD','OS'].every(e=>['sph','cyl','add'].every(f=>!r[e][f]||/^[+-]$/.test(r[e][f]))&&!r[e].axis)}
function hasClinical(x){return !!(x.times.start||x.times.check||x.times.end||!emptyRx(x.lens)||!emptyRx(x.rx)||x.obs.trim()||x.note.trim()||x.done||cats.some(c=>x.errors[c].text.trim()||x.errors[c].sev)||Object.keys(x.manual).length)}
function hasAppointment(x){return !!(x.pid||x.age||x.gender||x.hx||x.status!=='scheduled')}
function mask(v){v=String(v||'').replace(/\s/g,'');if(!v)return'—';let n=Math.min(4,Math.floor(v.length/2));return'*'.repeat(v.length-n)+v.slice(-n)}
function code(a=s,b=p){return curDate.slice(5,7)+curDate.slice(8)+'-'+session+'-S'+a+'-P'+b}
function fmt(i){if(!i)return'';let d=new Date(i);return pad(d.getHours())+':'+pad(d.getMinutes())}
function minutes(a,b){return a&&b?Math.round((new Date(b)-new Date(a))/60000):null}
function score(x,d){if(x.manual[d])return{x:x.manual[d],m:1};let n=8,fail=0;cats.forEach(c=>{let v=x.errors[c].sev;if(v&&errDefs[c].includes(d)){if(v===4)fail=1;else n-=v}});return{x:fail?4:Math.max(1,n),m:0}}
function render(){document.body.dataset.s=s;$('date').value=curDate;$('am').className='b'+(session==='AM'?' active':'');$('pm').className='b'+(session==='PM'?' active':'');$('stabs').innerHTML=[1,2,3,4].filter(i=>i<4||roster.show4).map(i=>`<button class="tab ${i===s?'active':''}" onclick="s=${i};p=1;render()">👨‍⚕️ ${roster.names[i]||'S '+i}</button>`).join('')+(roster.show4?'':'<button class="tab" onclick="roster.show4=true;saveRoster();render()">＋</button>');$('ptabs').innerHTML=[1,2,3].filter(i=>i<3||hasAppointment(db[s][3])).map(i=>`<button class="pill ${i===p?'active':''}" onclick="p=${i};render()">🗂️ Patient ${i}${db[s][i].done?' ✓':''}</button>`).join('')+(!hasAppointment(db[s][3])?'<button class="pill" onclick="p=3;render()">＋</button>':'');let x=P();$('banner').innerHTML=`📝 ${session} · ${roster.names[s]||'S '+s} ➔ Patient ${p}<small>${x.status.toUpperCase()} · ID ${mask(x.pid)} · ${code()}</small>`;$('sname').value=roster.names[s];$('group').value=roster.groups[s];$('pid').value=x.pid;$('age').value=x.age;$('hx').value=x.hx;$('gm').className='b'+(x.gender==='M'?' active':'');$('gf').className='b'+(x.gender==='F'?' active':'');$('code').textContent='Case Code: '+code();$('timers').innerHTML=[['start','Start'],['check','Dilation'],['end','Discharge']].map(([k,l])=>`<div class="timer"><label onclick="tapTime('${k}')">${l} (tap)</label><input type="time" value="${fmt(x.times[k])}" onchange="manualTime('${k}',this.value)"></div>`).join('');let total=minutes(x.times.start,x.times.end);$('duration').textContent=total===null?'':'Total '+total+' min';$('noshow').textContent=x.status==='noshow'?'🚫 No Show (tap to undo)':'🚫 Mark as No Show';$('noshow').className='b wide'+(x.status==='noshow'?' cancel':'');$('clinical').className=(x.status==='noshow'||x.status==='cancelled')?'hidden':'';$('lensbtn').className='b'+(mode==='lens'?' active':'');$('rxbtn').className='b'+(mode==='rx'?' active':'');renderRx(x);$('obs').value=x.obs;renderErrors(x);renderGrading(x);$('note').value=x.note;$('done').textContent=x.done?'☑ Grading completed':'☐ Grading not completed';$('done').className='b wide'+(x.done?' done':'')}
function renderRx(x){let r=x[mode];$('rxrows').innerHTML=['OD','OS'].map(e=>`<div class="rxr"><b>${e}</b>${['sph','cyl','axis','add'].map(f=>`<div class="cell ${e===eye&&f===field?'active':''}" onclick="eye='${e}';field='${f}';render()">${r[e][f]}</div>`).join('')}</div>`).join('');$('pad').innerHTML=[['7','n'],['8','n'],['9','n'],['.00','d'],['4','n'],['5','n'],['6','n'],['.25','d'],['1','n'],['2','n'],['3','n'],['.50','d'],['+/−','sign'],['0','n'],['⌫','back'],['.75','d']].map(a=>`<button class="key ${a[1]==='d'?'dec':''}" onclick="keypad('${a[0]}','${a[1]}')">${a[0]}</button>`).join('')}
function renderErrors(x){$('errors').innerHTML=cats.map((c,i)=>`<div class="err"><b>${c}</b><div class="muted">→ ${errDefs[c].map(d=>labels[d]).join(', ')}</div><textarea class="txt" oninput="P().errors[${JSON.stringify(c)}].text=this.value;save()">${x.errors[c].text}</textarea><div class="sev">${['Mild −1','Mod −2','Sev −3','⛔ Fail'].map((t,j)=>`<button class="${x.errors[c].sev===j+1?'on':''}" onclick="severity(${i},${j+1})">${t}</button>`).join('')}</div></div>`).join('')}
function renderGrading(x){$('grading').innerHTML=domains.map(d=>`<div style="margin-bottom:9px"><b>${labels[d]}</b><div class="scores">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="${score(x,d).x===n?'on':''}" onclick="manualScore('${d}',${n})">${n}</button>`).join('')}</div></div>`).join('');let vals=domains.map(d=>score(x,d).x),fails=domains.filter((d,i)=>vals[i]<=4),avg=(vals.reduce((a,b)=>a+b,0)/5).toFixed(1);$('overall').className='overall'+(fails.length?' fail':'');$('overall').textContent=fails.length?'⚠ FAIL RISK: '+fails.map(d=>labels[d]).join(', ')+' · avg '+avg:'✓ No domain ≤4 · avg '+avg}
function studentChanged(){roster.names[s]=$('sname').value;roster.groups[s]=$('group').value;saveRoster();render()}function infoChanged(){P().pid=$('pid').value;P().age=$('age').value;save();render()}function gender(g){P().gender=P().gender===g?'':g;save();render()}
function tapTime(k){let x=P();if(x.times[k]){if(confirm('Clear '+fmt(x.times[k])+'?'))x.times[k]=null}else x.times[k]=new Date().toISOString();save();render()}function manualTime(k,v){if(!v)P().times[k]=null;else{let d=new Date(curDate+'T00:00:00'),a=v.split(':');d.setHours(+a[0],+a[1],0,0);P().times[k]=d.toISOString()}save();render()}
function toggleNoShow(){P().status=P().status==='noshow'?'scheduled':'noshow';save();render()}function severity(i,n){let e=P().errors[cats[i]];e.sev=e.sev===n?0:n;save();render()}function manualScore(d,n){if(P().manual[d]===n)delete P().manual[d];else P().manual[d]=n;save();render()}
function keypad(v,t){let r=P()[mode][eye],q=r[field];if(t==='n'){if(field==='axis'){let z=q+v;if(+z>180||z.length>3)return toast('AXIS 1–180');r[field]=z}else r[field]=q+v}else if(t==='d'){if(field!=='axis'&&!q.includes('.'))r[field]=q+(/^[+-]$/.test(q)?'0':'')+v}else if(t==='sign'&&field!=='axis')r[field]=(q.startsWith('-')?'+':'-')+q.slice(1);else if(t==='back')r[field]=q.length>1?q.slice(0,-1):(field==='cyl'?'-':field==='axis'?'':'+');save();render()}
function setSession(v){session=v;s=1;p=1;load();render()}$('date').onchange=e=>{if(e.target.value){curDate=e.target.value;s=1;p=1;load();render()}}
function fillAssignment(){let ss=[1,2,3,4].filter(i=>i<4||roster.show4).map(i=>`<option value="${i}">S${i} ${roster.names[i]||''}</option>`).join(''),pp=[1,2,3].map(i=>`<option value="${i}">Patient ${i}</option>`).join('');$('fromS').innerHTML=$('toS').innerHTML=ss;$('fromP').innerHTML=$('toP').innerHTML=pp;$('fromS').value=s;$('fromP').value=p;$('toS').value=s===1?2:1;$('toP').value=p;assignmentPreview()}
function openSettings(){fillAssignment();$('settings').classList.add('show')}function closeSettings(){$('settings').classList.remove('show')}
function assignmentPreview(){let a=$('action').value,fs=+$('fromS').value||1,fp=+$('fromP').value||1,ts=+$('toS').value||1,tp=+$('toP').value||1,A=db[fs]?.[fp],B=db[ts]?.[tp];$('toRow').className=(a==='cancel'||a==='walkin')?'row hidden':'row';let lines=[`Current screen: S${s} P${p} — remains selected`,`Action: ${a.toUpperCase()}`,`Source S${fs} P${fp}: ID ${mask(A?.pid)}, ${hasClinical(A)?'LOCKED: clinical data exists':'not started'}`];if(a==='move'||a==='swap')lines.push(`Target S${ts} P${tp}: ID ${mask(B?.pid)}, ${hasClinical(B)?'LOCKED: clinical data exists':hasAppointment(B)?'appointment exists':'empty'}`);let ok=!!A&&!hasClinical(A);if(a==='move')ok=ok&&!hasAppointment(B)&&!(fs===ts&&fp===tp);if(a==='swap')ok=ok&&!!B&&!hasClinical(B)&&!(fs===ts&&fp===tp);if(a==='cancel'||a==='walkin')ok=ok&&hasAppointment(A);lines.push(ok?'✓ Safe to apply':'⚠ Cannot apply under current conditions');$('assignPreview').textContent=lines.join('\n');$('applyAssign').disabled=!ok}
function applyAssignment(){let a=$('action').value,fs=+$('fromS').value,fp=+$('fromP').value,ts=+$('toS').value,tp=+$('toP').value,A=db[fs][fp],B=db[ts][tp];if($('applyAssign').disabled)return;if(a==='move'){db[ts][tp]=norm(JSON.parse(JSON.stringify(A)));db[fs][fp]=patient()}else if(a==='swap'){db[fs][fp]=norm(JSON.parse(JSON.stringify(B)));db[ts][tp]=norm(JSON.parse(JSON.stringify(A)))}else if(a==='cancel'){A.status='cancelled'}else if(a==='walkin'){let old=mask(A.pid);db[fs][fp]=patient();db[fs][fp].status='walkin';db[fs][fp].replacementOf=old;db[fs][fp].hx='Walk-in replacement'+(old!=='—'?' (original '+old+' cancelled)':'')}save();closeSettings();render();toast('✓ Case assignment updated · still viewing S'+s+' P'+p)}
function report(){let L=[`Clinical Supervision Summary`,`Date: ${curDate} | Session: ${session} | App V${APP_VERSION}`];for(let i=1;i<=4;i++){if(i===4&&!roster.show4)continue;L.push('',`[Student: ${roster.names[i]||'S'+i}${roster.groups[i]?' ['+roster.groups[i]+']':''}]`);for(let j=1;j<=3;j++){let x=db[i][j];if(!hasAppointment(x)&&!hasClinical(x))continue;L.push(`  Patient ${j} (${code(i,j)}) | ${x.status.toUpperCase()} | ID ${mask(x.pid)} | ${x.age||'?'}${x.gender||'?'}`);if(x.replacementOf)L.push(`    Replacement of: ${x.replacementOf}`);if(x.status==='cancelled'||x.status==='noshow')continue;L.push(`    Times: Start ${fmt(x.times.start)||'—'} | Dilation ${fmt(x.times.check)||'—'} | Discharge ${fmt(x.times.end)||'—'}`);if(x.hx)L.push('    Hx: '+x.hx);if(x.obs)L.push('    Observations: '+x.obs);L.push('    Grading: '+domains.map(d=>labels[d]+' '+score(x,d).x).join(', '));cats.forEach(c=>{let e=x.errors[c];if(e.text||e.sev)L.push(`    ${c} [${e.sev||0}]: ${e.text}`)});if(x.note)L.push('    Comments: '+x.note)}}return L.join('\n')}
async function copyReport(){try{await navigator.clipboard.writeText(report());toast('✓ Summary copied')}catch(e){toast('⚠ Copy failed')}}async function shareReport(){if(navigator.share)try{return await navigator.share({title:'Clinical Log '+curDate+' '+session,text:report()})}catch(e){}copyReport()}function dl(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function downloadReport(){dl('ClinicalLog_'+curDate+'_'+session+'.txt',report(),'text/plain')}
function exportBackup(){let days={},rosters={};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k.startsWith(PFX+'day_'))days[k]=JSON.parse(localStorage.getItem(k));if(k.startsWith(PFX+'roster_'))rosters[k]=JSON.parse(localStorage.getItem(k))}dl('ClinicalLog_V25_backup_'+curDate+'.json',JSON.stringify({schema:SCHEMA_VERSION,exportedAt:new Date().toISOString(),days,rosters},null,2),'application/json')}
function importBackup(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result);if(o.schema!==SCHEMA_VERSION)throw 0;if(!confirm('Import backup and overwrite matching records?'))return;Object.entries(o.days||{}).forEach(([k,v])=>localStorage.setItem(k,JSON.stringify(v)));Object.entries(o.rosters||{}).forEach(([k,v])=>localStorage.setItem(k,JSON.stringify(v)));load();render();toast('✓ Backup imported')}catch(e){toast('⚠ Invalid V25 backup')}inp.value=''};r.readAsText(f)}
function resetSession(){if(!confirm('Reset '+curDate+' '+session+'? This cannot be undone.'))return;localStorage.removeItem(key());load();s=1;p=1;closeSettings();render();toast('Session reset')}
load();render();
</script></body></html>

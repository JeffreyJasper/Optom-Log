<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clinical Supervisor Log - Optometry V16</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --accent-red: #ff453a;
            --fixed-green: #32d74b;
            --border: #333333;
            --cell-active: #1a2a3a;
            
            --theme-color: #0a84ff;
            --theme-dark: #002b5e;
        }

        body[data-student="1"] { --theme-color: #0a84ff; --theme-dark: #002b5e; }
        body[data-student="2"] { --theme-color: #32d74b; --theme-dark: #0a3814; }
        body[data-student="3"] { --theme-color: #bf5af2; --theme-dark: #32004f; }
        body[data-student="4"] { --theme-color: #ff9f0a; --theme-dark: #4d2e00; }

        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; user-select: none; touch-action: manipulation; transition: background-color 0.3s; }
        .app-container { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; min-height: 100vh; }

        /* Session & Nav */
        .session-header { display: flex; background: #000; padding: 10px; gap: 10px; border-bottom: 1px solid var(--border); }
        .sess-btn { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-muted); font-size: 15px; font-weight: bold; transition: 0.3s; }
        .sess-btn.active { background: #ffffff; color: #000000; border-color: #ffffff; }

        .nav-header { background: var(--card-bg); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
        .tabs { display: flex; border-bottom: 1px solid var(--border); }
        .tab-btn { flex: 1; padding: 15px 5px; border: none; background: none; color: var(--text-muted); font-size: 14px; font-weight: bold; transition: color 0.3s; }
        .tab-btn.active { color: var(--theme-color); border-bottom: 3px solid var(--theme-color); background: #121212; }
        
        .patient-tabs { display: flex; padding: 10px; background: #000; gap: 10px; justify-content: center; }
        .p-btn { flex: 1; padding: 8px; border-radius: 20px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-muted); font-size: 13px; font-weight: bold; }
        .p-btn.active { background: #333; color: white; border-color: #555; }

        .status-banner { background: var(--theme-dark); color: white; text-align: center; padding: 8px; font-size: 14px; font-weight: bold; border-bottom: 1px solid var(--theme-color); }

        .mode-toggle { display: flex; gap: 8px; padding: 10px 10px 0 10px; background: var(--bg-color);}
        .m-btn { flex: 1; padding: 10px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-muted); font-size: 13px; font-weight: bold;}
        .m-btn.active { background: var(--theme-color); color: white; border-color: var(--theme-color); }

        /* Lens Subnav */
        .lens-subnav { display: flex; gap: 8px; padding: 10px; background: var(--bg-color); overflow-x: auto;}
        .l-tab { padding: 6px 12px; border-radius: 15px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-muted); font-size: 12px; white-space: nowrap;}
        .l-tab.active { background: #555; color: white; border-color: #777; }
        .l-add { background: transparent; border: 1px dashed var(--text-muted); color: var(--text-muted); }

        /* Info & Timer */
        .info-timer-section { padding: 10px; background: #121212; border-bottom: 1px solid var(--border); }
        .info-input { background: #000; border: 1px solid var(--border); color: white; padding: 8px; border-radius: 6px; flex: 1; font-size: 14px; box-sizing: border-box; }
        .gender-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 12px; border-radius: 6px; font-size: 14px; }
        .gender-btn.active { background: var(--theme-color); color: white; border-color: var(--theme-color); }
        
        .timer-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
        .t-btn { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 4px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .t-btn.active { border-color: var(--accent-green); background: #143a1a; }
        .t-lbl { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; display: block; text-transform: uppercase; width: 100%; padding: 4px 0;}
        .t-input { background: transparent; border: none; color: white; font-size: 16px; font-weight: bold; font-family: monospace; text-align: center; width: 100%; outline: none;}
        .t-input::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.5; }

        .btn-noshow { width: 100%; padding: 10px; background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--border); border-radius: 8px; font-weight: bold; margin-top: 10px; }
        .btn-noshow.active { background: #3a1515; color: var(--accent-red); border-color: var(--accent-red); }

        /* Rx Matrix & Numpad */
        .rx-matrix { padding: 0 10px 10px 10px; background: var(--bg-color); }
        .rx-header { display: grid; grid-template-columns: 30px repeat(4, 1fr); gap: 6px; margin-bottom: 4px; }
        .rx-header div { text-align: center; font-size: 11px; color: var(--text-muted); font-weight: bold; }
        .rx-row { display: grid; grid-template-columns: 30px repeat(4, 1fr); gap: 6px; margin-bottom: 8px; align-items: center; }
        .eye-lbl { font-size: 16px; font-weight: bold; color: var(--text-muted); text-align: center; }
        .rx-cell { background: var(--card-bg); border: 2px solid var(--border); border-radius: 6px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; font-family: monospace; }
        .rx-cell.active { border-color: var(--theme-color); background: var(--cell-active); }
        .val-minus { color: var(--accent-red); }
        .val-plus { color: var(--fixed-green); }

        .numpad-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1.2fr; gap: 8px; padding: 0 10px 10px 10px; background: var(--bg-color); }
        .btn-n { background: #2c2c2e; color: white; border: none; border-radius: 8px; height: 50px; font-size: 22px; font-weight: 500; }
        .btn-n.dec { color: var(--theme-color); font-size: 18px; font-weight: bold; }

        /* Errors & Severity Section */
        .scroll-area { flex-grow: 1; padding: 10px; overflow-y: auto; background: var(--bg-color); }
        .group-title { font-size: 12px; color: var(--theme-color); font-weight: bold; margin: 15px 0 5px 0; text-transform: uppercase; }
        .err-block { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px; margin-bottom: 10px; }
        .err-txt { width: 100%; background: #000; border: 1px solid #333; color: white; font-size: 13px; padding: 8px; border-radius: 6px; box-sizing: border-box; min-height: 50px; resize: vertical; margin-bottom: 8px;}
        .err-txt::placeholder { color: #555; font-style: italic; }
        .sev-row { display: flex; gap: 5px; }
        .sev-btn { flex: 1; padding: 6px 0; background: #1a1a1a; border: 1px solid #444; color: var(--text-muted); font-size: 11px; font-weight: bold; border-radius: 4px; }
        .sev-btn.active.mild { background: #5c4000; color: #ffb700; border-color: #ffb700; }
        .sev-btn.active.mod { background: #6b2a00; color: #ff6a00; border-color: #ff6a00; }
        .sev-btn.active.sev { background: #5a0000; color: #ff3b3b; border-color: #ff3b3b; }
        .sev-btn.active.unsafe { background: #ff0000; color: white; border-color: #ff0000; }

        /* Scoring */
        .footer-section { padding: 15px; background: var(--card-bg); border-top: 1px solid var(--border); margin-bottom: 40px; }
        .score-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .score-label { font-size: 12px; font-weight: bold; width: 90px; }
        .score-btns { display: flex; gap: 2px; flex-wrap: wrap; flex: 1; justify-content: flex-end; }
        .s-btn { width: 24px; height: 24px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-color); color: var(--text-muted); font-size: 12px; font-weight: bold;}
        .s-btn.active-auto { background: #1a3a5a; color: #64b5f6; border-color: #64b5f6; }
        .s-btn.active-manual { background: var(--theme-color); color: white; border-color: var(--theme-color); }

        .btn-sum { width: 100%; background: var(--theme-color); color: white; padding: 14px; border-radius: 8px; border: none; font-weight: bold; margin-top: 15px; font-size: 15px; text-transform: uppercase;}
    </style>
</head>
<body data-student="1">

<div class="app-container">
    <div class="session-header">
        <button class="sess-btn active" id="btn-AM" onclick="setSession('AM')">☀️ AM Session</button>
        <button class="sess-btn" id="btn-PM" onclick="setSession('PM')">🌙 PM Session</button>
    </div>

    <div class="nav-header">
        <div class="tabs" id="nav-s">
            <button class="tab-btn active" id="tab-s1" onclick="setS(1)">👨‍⚕️ S 1</button>
            <button class="tab-btn" id="tab-s2" onclick="setS(2)">👨‍⚕️ S 2</button>
            <button class="tab-btn" id="tab-s3" onclick="setS(3)">👨‍⚕️ S 3</button>
            <button class="tab-btn" id="tab-s4" onclick="setS(4)" style="display:none;">👨‍⚕️ S 4</button>
            <button class="tab-btn" id="btn-add-s" onclick="addS4()" style="flex: 0.4;">➕</button>
        </div>
        <div class="patient-tabs" id="nav-p">
            <button class="p-btn active" onclick="setP(1)">🗂️ Patient 1</button>
            <button class="p-btn" onclick="setP(2)">🗂️ Patient 2</button>
        </div>
        <div class="status-banner" id="status-banner"></div>
    </div>

    <div class="info-timer-section">
        <div style="display: flex; gap: 10px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed var(--border);">
            <input type="text" id="s-name" class="info-input" placeholder="Student Name" oninput="updateStudentInfo()">
            <input type="text" id="s-group" class="info-input" style="max-width: 110px;" placeholder="Group (e.g. N1)" oninput="updateStudentInfo()">
        </div>

        <div class="patient-info">
            <input type="text" id="p-id" class="info-input" style="flex: 1.5;" placeholder="Patient ID" oninput="updateInfo()">
            <input type="number" id="p-age" class="info-input" style="flex: 1; max-width: 70px;" placeholder="Age" oninput="updateInfo()">
            <button class="gender-btn" id="g-M" onclick="setGender('M')">M</button>
            <button class="gender-btn" id="g-F" onclick="setGender('F')">F</button>
        </div>
        
        <div style="display: flex; gap: 8px; margin-bottom: 8px;">
            <textarea id="txt-prev-hx" class="info-input" style="width:100%; height: 42px; font-size: 12px; margin: 0;" placeholder="Paste Previous Hx prepared here..." oninput="updatePrevHx()"></textarea>
            <button class="m-btn active" style="flex: 0 0 75px; margin: 0; padding: 0; font-size: 12px;" onclick="setNewCase()">New Case</button>
        </div>

        <!-- 全新時間輸入區：點擊標籤抓現在時間，點擊數字可手動輸入 -->
        <div class="timer-grid">
            <div class="t-btn" id="t-start">
                <span class="t-lbl" onclick="logTime('start')">Case Start (Tap)</span>
                <input type="time" class="t-input" id="v-start" onchange="manualTime('start', this.value)">
            </div>
            <div class="t-btn" id="t-check">
                <span class="t-lbl" onclick="logTime('check')">Dilation (Tap)</span>
                <input type="time" class="t-input" id="v-check" onchange="manualTime('check', this.value)">
            </div>
            <div class="t-btn" id="t-end">
                <span class="t-lbl" onclick="logTime('end')">Discharge (Tap)</span>
                <input type="time" class="t-input" id="v-end" onchange="manualTime('end', this.value)">
            </div>
        </div>

        <button id="btn-noshow" class="btn-noshow" onclick="toggleNoShow()">🚫 Mark as No Show</button>
    </div>

    <div id="main-content-zone">
        <div class="mode-toggle">
            <button class="m-btn active" id="btn-lens" onclick="setM('lens')">Lensometry</button>
            <button class="m-btn" id="btn-rx" onclick="setM('rx')">Supervisor Rx</button>
        </div>
        
        <!-- Lens 多副擴充區 -->
        <div class="lens-subnav" id="lens-subnav"></div>

        <div class="rx-matrix">
            <div class="rx-header"><div></div><div>SPH</div><div>CYL</div><div>AXIS</div><div>ADD</div></div>
            <div class="rx-row">
                <div class="eye-lbl">OD</div>
                <div class="rx-cell active" id="c-OD-sph" onclick="setF('OD','sph')"></div>
                <div class="rx-cell" id="c-OD-cyl" onclick="setF('OD','cyl')"></div>
                <div class="rx-cell" id="c-OD-axis" onclick="setF('OD','axis')"></div>
                <div class="rx-cell" id="c-OD-add" onclick="setF('OD','add')"></div>
            </div>
            <div class="rx-row">
                <div class="eye-lbl">OS</div>
                <div class="rx-cell" id="c-OS-sph" onclick="setF('OS','sph')"></div>
                <div class="rx-cell" id="c-OS-cyl" onclick="setF('OS','cyl')"></div>
                <div class="rx-cell" id="c-OS-axis" onclick="setF('OS','axis')"></div>
                <div class="rx-cell" id="c-OS-add" onclick="setF('OS','add')"></div>
            </div>
        </div>

        <div class="numpad-grid">
            <button class="btn-n" onclick="inN('7')">7</button><button class="btn-n" onclick="inN('8')">8</button><button class="btn-n" onclick="inN('9')">9</button><button class="btn-n dec" onclick="inD('.00')">.00</button>
            <button class="btn-n" onclick="inN('4')">4</button><button class="btn-n" onclick="inN('5')">5</button><button class="btn-n" onclick="inN('6')">6</button><button class="btn-n dec" onclick="inD('.25')">.25</button>
            <button class="btn-n" onclick="inN('1')">1</button><button class="btn-n" onclick="inN('2')">2</button><button class="btn-n" onclick="inN('3')">3</button><button class="btn-n dec" onclick="inD('.50')">.50</button>
            <button class="btn-n sign" onclick="tglSign()">+/-</button><button class="btn-n" onclick="inN('0')">0</button><button class="btn-n action" onclick="clr()">C</button><button class="btn-n dec" onclick="inD('.75')">.75</button>
        </div>

        <div class="scroll-area">
            <div class="group-title" style="color: #ff9f0a; font-size: 13px;">⚠️ Clinical Errors & Deductions</div>
            <div id="errors-container-main"></div>
            
            <div class="footer-section">
                <div class="group-title" style="color: #32d74b; font-size: 13px;">📊 Grading (Scale 1-9, Base 8, Fail ≤4)</div>
                <div class="score-row"><div class="score-label">Preliminary</div><div class="score-btns" id="sc-prelim"></div></div>
                <div class="score-row"><div class="score-label">Communication</div><div class="score-btns" id="sc-comm"></div></div>
                <div class="score-row"><div class="score-label">Proficiency</div><div class="score-btns" id="sc-prof"></div></div>
                <div class="score-row"><div class="score-label">Fluency</div><div class="score-btns" id="sc-fluency"></div></div>
                <div class="score-row"><div class="score-label">Accuracy</div><div class="score-btns" id="sc-accuracy"></div></div>
                
                <textarea id="txt-note" style="min-height: 80px;" placeholder="Additional overall comments..."></textarea>
                
                <button class="btn-sum" onclick="genSum()">Copy AI Summary</button>
                <button class="btn-sum" style="background: #3a3a3c; color: var(--accent-red); margin-top: 10px;" onclick="executeReset()">Reset Session</button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentSession = 'AM';
    let cS = 1, cP = 1, cM = 'lens', aE = 'OD', aF = 'sph', currentLensIdx = 0;
    let db = {};
    
    // Master List (V16) - Used as placeholders
    const errDefs = {
        '1. History & Workflow': { ph: 'e.g., Inefficient Workflow, Missed Chief Complaint, Incomplete Glauc Risks...', map: ['comm', 'fluency'] },
        '2. Preliminary Tests': { ph: 'e.g., 3-Sec Rule Violation, Incorrect Target, Confrontation Errors...', map: ['prelim'] },
        '3. Refraction': { ph: 'e.g., Poor Accomm Control, Auto-Refractor Reliance, Over-Minusing...', map: ['prof', 'accuracy'] },
        '4. Anterior Seg & Tono': { ph: 'e.g., Incorrect Seq (GAT/Gonio), Inaccurate van Herick, Missed Pathology...', map: ['prof', 'accuracy'] },
        '5. Post Seg & Glaucoma': { ph: 'e.g., Inc. Peripheral Sweeps, Imaging Mismatch, Missed Disc Haems...', map: ['prof', 'accuracy'] },
        '6. Dx, Mgmt & Record': { ph: 'e.g., Vague Descriptions, Premature Dx, Delayed Data Entry...', map: ['prof'] },
        '7. Professionalism': { ph: 'e.g., Academic Dishonesty, Lack of Prep, Unprofessional Comm...', map: ['comm', 'fluency'] }
    };

    function bRx() { return {sph:'+',cyl:'-',axis:'',add:'+'}; }
    
    function init() {
        db = JSON.parse(localStorage.getItem('optom_v16_' + currentSession)) || {};
        if (!db.settings) db.settings = { names: {1: '', 2: '', 3: '', 4: ''}, groups: {1: '', 2: '', 3: '', 4: ''}, showS4: false };

        for(let s=1;s<=4;s++) { 
            if(!db[s]) db[s]={}; 
            for(let p=1;p<=2;p++) { 
                if(!db[s][p]) {
                    db[s][p] = { 
                        pxId: '', age:'', gender:'', prevHx:'', noShow: false, 
                        times:{start:null,check:null,end:null}, 
                        lenses: [ {OD:bRx(), OS:bRx()} ], // 支援多副眼鏡
                        rx:{OD:bRx(),OS:bRx()}, 
                        errors: {}, manualScores: {}, note:''
                    };
                    // 初始化 errors
                    for(let cat in errDefs) db[s][p].errors[cat] = { text:'', sev: 0 };
                }
            } 
        }
        
        buildErrorUI();
        buildScoreUI();
        render();
    }

    function buildErrorUI() {
        let html = '';
        for (let cat in errDefs) {
            let safeId = cat.replace(/[^a-zA-Z0-9]/g, '');
            html += `
            <div class="err-block">
                <div class="group-title">${cat}</div>
                <textarea class="err-txt" id="err-txt-${safeId}" placeholder="${errDefs[cat].ph}" oninput="updErrTxt('${cat}', this.value)"></textarea>
                <div class="sev-row" id="sev-row-${safeId}">
                    <button class="sev-btn mild" onclick="setSev('${cat}', 1)">Mild -1</button>
                    <button class="sev-btn mod" onclick="setSev('${cat}', 2)">Mod -2</button>
                    <button class="sev-btn sev" onclick="setSev('${cat}', 3)">Sev -3</button>
                    <button class="sev-btn unsafe" onclick="setSev('${cat}', 4)">Unsafe (Fail)</button>
                </div>
            </div>`;
        }
        document.getElementById('errors-container-main').innerHTML = html;
    }

    function buildScoreUI() {
        ['prelim','comm','prof','fluency','accuracy'].forEach(id => {
            document.getElementById('sc-'+id).innerHTML = [1,2,3,4,5,6,7,8,9].map(n => 
                `<button class="s-btn" onclick="setManualSc('${id}',${n})">${n}</button>`
            ).join('');
        });
    }

    function save() { localStorage.setItem('optom_v16_' + currentSession, JSON.stringify(db)); }

    function setSession(sess) {
        currentSession = sess;
        document.getElementById('btn-AM').className = 'sess-btn ' + (sess=='AM'?'active':'');
        document.getElementById('btn-PM').className = 'sess-btn ' + (sess=='PM'?'active':'');
        cS = 1; cP = 1; setM('lens');
        document.querySelectorAll('#nav-s .tab-btn').forEach((b,i)=>b.classList.toggle('active', i==0));
        document.querySelectorAll('#nav-p .p-btn').forEach((b,i)=>b.classList.toggle('active', i==0));
        init();
    }

    // 計算自動評分
    function getCalcScore(d, field) {
        if (d.manualScores[field]) return { val: d.manualScores[field], isManual: true };
        let score = 8; // Default 8
        let isFail = false;
        
        for (let cat in d.errors) {
            let sev = d.errors[cat].sev;
            if (sev > 0 && errDefs[cat].map.includes(field)) {
                if (sev === 4) isFail = true;
                else score -= sev; // Mild=1, Mod=2, Sev=3
            }
        }
        if (isFail) return { val: 4, isManual: false };
        return { val: Math.max(1, Math.min(9, score)), isManual: false };
    }

    function render() {
        let d = db[cS][cP];
        
        document.getElementById('tab-s4').style.display = db.settings.showS4 ? 'block' : 'none';
        document.getElementById('btn-add-s').style.display = db.settings.showS4 ? 'none' : 'block';

        for(let i=1; i<=4; i++) document.getElementById('tab-s'+i).innerText = '👨‍⚕️ ' + (db.settings.names[i] || ('S ' + i)); 
        document.getElementById('s-name').value = db.settings.names[cS];
        document.getElementById('s-group').value = db.settings.groups[cS];
        document.getElementById('status-banner').innerHTML = `📝 👨‍⚕️ ${db.settings.names[cS] || 'S '+cS} ➔ Patient ${cP}`;

        document.getElementById('p-id').value = d.pxId; document.getElementById('p-age').value = d.age;
        document.getElementById('g-M').className = 'gender-btn ' + (d.gender=='M'?'active':'');
        document.getElementById('g-F').className = 'gender-btn ' + (d.gender=='F'?'active':'');
        document.getElementById('txt-prev-hx').value = d.prevHx;
        
        document.getElementById('main-content-zone').style.display = d.noShow ? 'none' : 'block';
        let bNs = document.getElementById('btn-noshow');
        bNs.className = 'btn-noshow ' + (d.noShow?'active':'');
        bNs.innerText = d.noShow ? '🚫 Patient marked as No Show (Tap to undo)' : '🚫 Mark as No Show';

        // 渲染時間輸入
        ['start','check','end'].forEach(k => {
            let input = document.getElementById('v-'+k);
            if(d.times[k]) {
                let dt = new Date(d.times[k]);
                input.value = dt.getHours().toString().padStart(2, '0') + ':' + dt.getMinutes().toString().padStart(2, '0');
            } else { input.value = ''; }
        });

        // 渲染 Lens Subnav
        let subnav = document.getElementById('lens-subnav');
        if (cM === 'lens') {
            subnav.style.display = 'flex';
            let lHtml = '';
            for(let i=0; i<d.lenses.length; i++) {
                lHtml += `<button class="l-tab ${currentLensIdx===i?'active':''}" onclick="setLensIdx(${i})">Lens ${i+1}</button>`;
            }
            lHtml += `<button class="l-tab l-add" onclick="addLens()">+ Add</button>`;
            subnav.innerHTML = lHtml;
        } else {
            subnav.style.display = 'none';
        }

        let rx = cM === 'lens' ? d.lenses[currentLensIdx] : d.rx;
        ['OD','OS'].forEach(e => ['sph','cyl','axis','add'].forEach(f => {
            let el = document.getElementById(`c-${e}-${f}`); el.innerText = rx[e][f];
            el.className = 'rx-cell ' + (e==aE && f==aF?'active ':'') + (rx[e][f].includes('-')?'val-minus':'val-plus');
        }));

        // 渲染 Errors & Severities
        for (let cat in errDefs) {
            let safeId = cat.replace(/[^a-zA-Z0-9]/g, '');
            document.getElementById(`err-txt-${safeId}`).value = d.errors[cat].text;
            let sev = d.errors[cat].sev;
            let btns = document.querySelectorAll(`#sev-row-${safeId} .sev-btn`);
            btns.forEach((b, i) => b.classList.toggle('active', sev === i+1));
        }

        // 渲染 Scores
        ['prelim','comm','prof','fluency','accuracy'].forEach(id => {
            let res = getCalcScore(d, id);
            let btns = document.querySelectorAll(`#sc-${id} .s-btn`);
            btns.forEach((b, i) => {
                b.className = 's-btn';
                if (i+1 === res.val) b.classList.add(res.isManual ? 'active-manual' : 'active-auto');
            });
        });
        document.getElementById('txt-note').value = d.note;
    }

    function addS4() { db.settings.showS4 = true; save(); render(); }
    function toggleNoShow() { db[cS][cP].noShow = !db[cS][cP].noShow; save(); render(); }
    function setNewCase() { db[cS][cP].prevHx = 'New case'; save(); render(); }
    function updateStudentInfo() { db.settings.names[cS] = document.getElementById('s-name').value; db.settings.groups[cS] = document.getElementById('s-group').value; save(); render(); }
    function updateInfo() { db[cS][cP].pxId = document.getElementById('p-id').value; db[cS][cP].age = document.getElementById('p-age').value; save(); }
    function updatePrevHx() { db[cS][cP].prevHx = document.getElementById('txt-prev-hx').value; save(); }
    function setGender(g) { db[cS][cP].gender = db[cS][cP].gender == g ? '' : g; save(); render(); }
    
    function logTime(k) { 
        db[cS][cP].times[k] = db[cS][cP].times[k] ? null : new Date().toISOString(); 
        save(); render(); 
    }
    function manualTime(k, val) {
        if(!val) { db[cS][cP].times[k] = null; } 
        else {
            let d = new Date(); let [h, m] = val.split(':');
            d.setHours(h, m, 0, 0); db[cS][cP].times[k] = d.toISOString();
        }
        save(); render();
    }
    
    function setS(s) { cS = s; document.body.setAttribute('data-student', s); document.querySelectorAll('#nav-s .tab-btn').forEach((b,i)=>b.classList.toggle('active', i==s-1)); currentLensIdx=0; render(); }
    function setP(p) { cP = p; document.querySelectorAll('#nav-p .p-btn').forEach((b,i)=>b.classList.toggle('active', i==p-1)); currentLensIdx=0; render(); }
    function setM(m) { cM=m; document.getElementById('btn-lens').classList.toggle('active',m=='lens'); document.getElementById('btn-rx').classList.toggle('active',m=='rx'); render(); }
    function setLensIdx(idx) { currentLensIdx = idx; render(); }
    function addLens() { db[cS][cP].lenses.push({OD:bRx(), OS:bRx()}); currentLensIdx = db[cS][cP].lenses.length - 1; save(); render(); }
    function setF(e,f) { aE=e; aF=f; render(); }
    
    function inN(n) { let v = cM==='lens'?db[cS][cP].lenses[currentLensIdx][aE][aF]:db[cS][cP].rx[aE][aF]; if(aF=='axis' && v.length>=3) return; cM==='lens'?db[cS][cP].lenses[currentLensIdx][aE][aF]+=n : db[cS][cP].rx[aE][aF]+=n; save(); render(); }
    function inD(d) { let v = cM==='lens'?db[cS][cP].lenses[currentLensIdx][aE][aF]:db[cS][cP].rx[aE][aF]; if(aF=='axis' || v.includes('.')) return; let nv = v+(v=='+'||v=='-'?'0':'')+d; cM==='lens'?db[cS][cP].lenses[currentLensIdx][aE][aF]=nv : db[cS][cP].rx[aE][aF]=nv; save(); render(); }
    function tglSign() { if(aF!='sph') return; let v = cM==='lens'?db[cS][cP].lenses[currentLensIdx][aE][aF]:db[cS][cP].rx[aE][aF]; let nv = v.startsWith('+')?'-'+v.substring(1):'+'+v.substring(1); cM==='lens'?db[cS][cP].lenses[currentLensIdx][aE][aF]=nv : db[cS][cP].rx[aE][aF]=nv; save(); render(); }
    function clr() { let nv = aF=='cyl'?'-':(aF=='axis'?'':'+'); cM==='lens'?db[cS][cP].lenses[currentLensIdx][aE][aF]=nv : db[cS][cP].rx[aE][aF]=nv; save(); render(); }
    
    function updErrTxt(cat, val) { db[cS][cP].errors[cat].text = val; save(); }
    function setSev(cat, lvl) { 
        db[cS][cP].errors[cat].sev = db[cS][cP].errors[cat].sev === lvl ? 0 : lvl; 
        // 重置受影響項目的手動分數，交回給 Auto 計算
        errDefs[cat].map.forEach(field => { delete db[cS][cP].manualScores[field]; });
        save(); render(); 
    }
    
    function setManualSc(id, n) { 
        if (db[cS][cP].manualScores[id] === n) delete db[cS][cP].manualScores[id]; // Toggle off
        else db[cS][cP].manualScores[id] = n; 
        save(); render(); 
    }

    document.getElementById('txt-note').oninput = (e) => { db[cS][cP].note = e.target.value; save(); };

    function genSum() {
        let r = `=== Clinical Supervision Summary (${currentSession} Session) ===\n`;

        for(let s=1;s<=4;s++){
            if (s === 4 && !db.settings.showS4) continue;
            let stuDisplay = db.settings.groups[s] ? `${db.settings.names[s]||'S'+s} [${db.settings.groups[s]}]` : (db.settings.names[s]||'S'+s);
            r += `\n[Student: ${stuDisplay}]\n`;
            
            for(let p=1;p<=2;p++){
                let d = db[s][p];
                if (d.noShow) { r += `  Patient ${p}:\n    *** NO SHOW ***\n`; continue; }

                if(d.times.start){
                    let pxIdDisplay = d.pxId ? `ID: ${d.pxId}, ` : '';
                    r += `  Patient ${p} (${pxIdDisplay}${d.age || '?'}${d.gender || '?'}):\n`;
                    if (d.prevHx) r += `    Prev Hx: ${d.prevHx}\n`;
                    
                    for(let i=0; i<d.lenses.length; i++) {
                        let l = d.lenses[i];
                        let title = d.lenses.length > 1 ? `Habitual Lens ${i+1}` : `Habitual Lens`;
                        r += `    ${title}: OD ${l.OD.sph}/${l.OD.cyl}x${l.OD.axis} | OS ${l.OS.sph}/${l.OS.cyl}x${l.OS.axis}\n`;
                    }
                    r += `    Supervisor Rx: OD ${d.rx.OD.sph}/${d.rx.OD.cyl}x${d.rx.OD.axis} | OS ${d.rx.OS.sph}/${d.rx.OS.cyl}x${d.rx.OS.axis}\n`;
                    
                    let sPre=getCalcScore(d,'prelim').val, sCom=getCalcScore(d,'comm').val, sPro=getCalcScore(d,'prof').val, sFlu=getCalcScore(d,'fluency').val, sAcc=getCalcScore(d,'accuracy').val;
                    r += `    Grading: Prelim(${sPre}), Comm(${sCom}), Prof(${sPro}), Fluen(${sFlu}), Accu(${sAcc})\n`;
                    
                    let errs = [];
                    for(let cat in d.errors) {
                        let e = d.errors[cat];
                        if (e.sev > 0 || e.text.trim() !== '') {
                            let sevStr = e.sev==1?'Mild -1':(e.sev==2?'Mod -2':(e.sev==3?'Sev -3':(e.sev==4?'Unsafe/Fail':'No deduction')));
                            let txt = e.text.trim() ? ` - "${e.text}"` : '';
                            errs.push(`${cat} [${sevStr}]${txt}`);
                        }
                    }
                    if (errs.length > 0) { r += `    Errors Logged:\n      ` + errs.join('\n      ') + `\n`; }
                    if (d.note) r += `    Comments: ${d.note}\n`;
                }
            }
        }
        navigator.clipboard.writeText(r); alert("AI Summary copied to clipboard!");
    }

    function executeReset() {
        if(confirm(`⚠️ 確認永久清除 ${currentSession} Session 所有資料？`)){
            localStorage.removeItem('optom_v16_' + currentSession); init(); setS(1);
        }
    }

    init();
</script>
</body>
</html>

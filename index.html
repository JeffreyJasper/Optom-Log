<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Clinical Supervisor Log V18</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--text:#fff;--muted:#a0a0a8;--red:#ff453a;--green:#32d74b;--border:#333;--cell-active:#1a2a3a;--theme:#0a84ff;--theme-dark:#002b5e}
body[data-student="1"]{--theme:#0a84ff;--theme-dark:#002b5e}
body[data-student="2"]{--theme:#32d74b;--theme-dark:#0a3814}
body[data-student="3"]{--theme:#bf5af2;--theme-dark:#32004f}
body[data-student="4"]{--theme:#ff9f0a;--theme-dark:#4d2e00}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);margin:0;padding:0;touch-action:manipulation;font-size:14px}
input,textarea,select{-webkit-user-select:text;user-select:text;font-family:inherit}
button{font-family:inherit;cursor:pointer}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;min-height:100vh}
.top-bar{display:flex;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);align-items:center}
.top-bar input[type=date]{flex:1;background:var(--card);color:#fff;border:1px solid var(--border);border-radius:8px;padding:9px;font-size:14px;color-scheme:dark}
.sess-btn{flex:0 0 auto;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:14px;font-weight:bold}
.sess-btn.active{background:#fff;color:#000;border-color:#fff}
.gear{flex:0 0 auto;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:#fff;font-size:16px}
.nav{background:var(--card);position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border)}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab-btn{flex:1;padding:14px 4px;border:none;background:none;color:var(--muted);font-size:14px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab-btn.active{color:var(--theme);border-bottom:3px solid var(--theme);background:#121212}
.ptabs{display:flex;padding:8px 10px;background:#000;gap:10px}
.p-btn{flex:1;padding:10px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:14px;font-weight:bold}
.p-btn.active{background:#333;color:#fff;border-color:#555}
.banner{background:var(--theme-dark);color:#fff;text-align:center;padding:8px;font-size:14px;font-weight:bold;border-bottom:1px solid var(--theme)}
.banner.fail{background:#5a0000;border-color:var(--red)}
.banner small{display:block;font-weight:normal;font-size:12px;opacity:.9;margin-top:2px}
.info{padding:10px;background:#121212;border-bottom:1px solid var(--border)}
.row{display:flex;gap:8px;margin-bottom:8px}
.inp{background:#000;border:1px solid var(--border);color:#fff;padding:10px;border-radius:6px;flex:1;font-size:15px;min-width:0}
.gbtn{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:10px 14px;border-radius:6px;font-size:15px}
.gbtn.active{background:var(--theme);color:#fff;border-color:var(--theme)}
.reveal{background:#2c2c2e;color:#fff;border:1px solid #555;border-radius:6px;padding:0 12px;font-size:13px;user-select:none;-webkit-user-select:none;touch-action:none}
.codeline{font-size:12px;color:var(--muted);margin:-2px 0 8px;word-break:break-all}
.timers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.tbtn{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:4px;text-align:center}
.tlbl{font-size:12px;color:var(--muted);display:block;padding:8px 0;cursor:pointer;background:#252528;border-radius:6px;margin-bottom:4px}
.tin{background:transparent;border:none;color:#fff;font-size:17px;font-weight:bold;font-family:monospace;text-align:center;width:100%;outline:none;color-scheme:dark}
.dur{font-size:12px;color:var(--muted);margin-top:6px;text-align:center}
.btn-wide{width:100%;padding:12px;background:var(--card);color:var(--muted);border:1px solid var(--border);border-radius:8px;font-weight:bold;margin-top:8px;font-size:14px}
.btn-wide.active{background:#3a1515;color:var(--red);border-color:var(--red)}
.btn-wide.done{background:#12331a;color:var(--green);border-color:var(--green)}
.mode{display:flex;gap:8px;padding:10px 10px 0}
.m-btn{flex:1;padding:12px 8px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:14px;font-weight:bold}
.m-btn.active{background:var(--theme);color:#fff;border-color:var(--theme)}
.lens-sub{display:flex;gap:8px;padding:10px;overflow-x:auto;align-items:center}
.l-tab{padding:9px 14px;border-radius:16px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:13px;white-space:nowrap}
.l-tab.active{background:#555;color:#fff;border-color:#777}
.l-add{background:transparent;border:1px dashed var(--muted)}
.l-sel{background:var(--card);color:#fff;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:13px}
.rx{padding:0 10px 6px}
.rx-h,.rx-r{display:grid;grid-template-columns:34px repeat(4,1fr);gap:6px;margin-bottom:6px;align-items:center}
.rx-h div{text-align:center;font-size:12px;color:var(--muted);font-weight:bold}
.eye{font-size:16px;font-weight:bold;color:var(--muted);text-align:center}
.cell{background:var(--card);border:2px solid var(--border);border-radius:6px;height:46px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;font-family:monospace}
.cell.active{border-color:var(--theme);background:var(--cell-active)}
.cell.empty{opacity:.45}
.minus{color:var(--red)}.plus{color:var(--green)}
.rx-tools{display:flex;justify-content:flex-end;padding:0 10px 6px}
.small-btn{background:#2c2c2e;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:12px}
.pad{display:grid;grid-template-columns:1fr 1fr 1fr 1.2fr;gap:8px;padding:0 10px 10px}
.bn{background:#2c2c2e;color:#fff;border:none;border-radius:8px;height:52px;font-size:22px;font-weight:500}
.bn.dec{color:var(--theme);font-size:18px;font-weight:bold}
.scroll{flex-grow:1;padding:10px}
.gt{font-size:13px;font-weight:bold;margin:15px 0 6px;text-transform:uppercase}
.txt{width:100%;background:#000;border:1px solid #333;color:#fff;font-size:14px;padding:10px;border-radius:6px;min-height:56px;resize:vertical;margin-bottom:8px}
.txt::placeholder{color:#666;font-style:italic}
.err{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:10px}
.err .gt{margin-top:0;color:var(--theme)}
.err .map{font-size:11px;color:var(--muted);font-weight:normal;text-transform:none}
.sev{display:flex;gap:5px}
.sb{flex:1;padding:10px 0;background:#1a1a1a;border:1px solid #444;color:var(--muted);font-size:12px;font-weight:bold;border-radius:4px}
.sb.active.mild{background:#5c4000;color:#ffb700;border-color:#ffb700}
.sb.active.mod{background:#6b2a00;color:#ff6a00;border-color:#ff6a00}
.sb.active.sev3{background:#5a0000;color:#ff3b3b;border-color:#ff3b3b}
.sb.active.unsafe{background:#f00;color:#fff;border-color:#f00}
.foot{padding:14px;background:var(--card);border-top:1px solid var(--border);margin-bottom:40px;border-radius:8px}
.srow{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.slbl{font-size:13px;font-weight:bold;width:92px;flex:0 0 92px}
.sbtns{display:flex;gap:3px;flex:1;justify-content:flex-end}
.s-btn{width:32px;height:36px;border-radius:4px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:14px;font-weight:bold;padding:0}
.s-btn.auto{background:#1a3a5a;color:#64b5f6;border-color:#64b5f6}
.s-btn.manual{background:var(--theme);color:#fff;border-color:var(--theme)}
.s-btn.fail{background:#5a0000!important;color:#ff6b6b!important;border-color:var(--red)!important}
.s-reset{width:30px;height:36px;border-radius:4px;border:1px solid var(--border);background:#2c2c2e;color:#fff;font-size:14px;padding:0;visibility:hidden}
.s-reset.show{visibility:visible}
.overall{font-size:13px;margin:4px 0 12px;padding:8px;border-radius:6px;background:#12331a;color:var(--green)}
.overall.fail{background:#3a1515;color:#ff6b6b}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn{padding:14px 6px;border-radius:8px;border:none;font-weight:bold;font-size:14px;background:var(--theme);color:#fff}
.btn.alt{background:#3a3a3c}
.btn.danger{background:#3a3a3c;color:var(--red)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;display:none;overflow-y:auto}
.modal.show{display:block}
.mbox{max-width:520px;margin:0 auto;padding:16px;background:#121212;min-height:100%}
.mbox h3{margin:18px 0 6px;font-size:15px;color:var(--theme)}
.mbox p{font-size:12px;color:var(--muted);margin:4px 0 8px;line-height:1.5}
.stored{display:flex;justify-content:space-between;align-items:center;padding:8px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;font-size:13px}
.stored .old{color:#ffb700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;font-size:14px;font-weight:bold;z-index:900;display:none;max-width:90%;text-align:center}
</style>
</head>

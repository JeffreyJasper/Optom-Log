<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clinical Supervisor Log - Optometry V13</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --accent-red: #ff453a;
            --fixed-green: #32d74b;
            --border: #333333;
            --cell-active: #1a2a3a;
            --theme-color: #0a84ff;
            --theme-dark: #002b5e;
        }

        body[data-student="1"] { --theme-color: #0a84ff; --theme-dark: #002b5e; }
        body[data-student="2"] { --theme-color: #32d74b; --theme-dark: #0a3814; }
        body[data-student="3"] { --theme-color: #bf5af2; --theme-dark: #32004f; }
        body[data-student="4"] { --theme-color: #ff9f0a; --theme-dark: #4d2e00; }

        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; user-select: none; touch-action: manipulation; transition: background-color 0.3s; }
        .app-container { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; min-height: 100vh; }

        /* AM/PM Session Toggle */
        .session-header { display: flex; background: #000; padding: 10px; gap: 10px; border-bottom: 1px solid var(--border); }
        .sess-btn { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-muted); font-size: 15px; font-weight: bold; transition: 0.3s; }
        .sess-btn.active { background: #ffffff; color: #000000; border-color: #ffffff; }

        /* Navigation Header */
        .nav-header { background: var(--card-bg); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
        .tabs { display: flex; border-bottom: 1px solid var(--border); }
        .tab-btn { flex: 1; padding: 15px 5px; border: none; background: none; color: var(--text-muted); font-size: 14px; font-weight: bold; transition: color 0.3s; }
        .tab-btn.active { color: var(--theme-color); border-bottom: 3px solid var(--theme-color); background: #121212; }
        
        .patient-tabs { display: flex; padding: 10px; background: #000; gap: 10px; justify-content: center; }
        .p-btn { flex: 1; padding: 8px; border-radius: 20px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-muted); font-size: 13px; font-weight: bold; }
        .p-btn.active { background: #333; color: white; border-color: #555; }

        .status-banner { background: var(--theme-dark); color: white; text-align: center; padding: 8px; font-size: 14px; font-weight: bold; letter-spacing: 0.5px; border-bottom: 1px solid var(--theme-color); transition: all 0.3s; }

        .info-timer-section { padding: 10px; background: #121212; border-bottom: 1px solid var(--border); }
        .info-input { background: #000; border: 1px solid var(--border); color: white; padding: 8px; border-radius: 6px; flex: 1; font-size: 14px; box-sizing: border-box; }
        .gender-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 12px; border-radius: 6px; font-size: 14px; }
        .gender-btn.active { background: var(--theme-color); color: white; border-color: var(--theme-color); }
        
        .timer-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
        .t-btn { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 4px; text-align: center; }
        .t-btn.active { border-color: var(--fixed-green); background: #143a1a; }
        .t-lbl { font-size: 9px; color: var(--text-muted); margin-bottom: 4px; display: block; text-transform: uppercase;}
        .t-val { font-size: 14px; font-weight: bold; font-family: monospace; }
        
        .btn-noshow { width: 100%; padding: 10px; background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--border); border-radius: 8px; font-weight: bold; margin-top: 10px; }
        .btn-noshow.active { background: #3a1515; color: var(--accent-red); border-color: var(--accent-red); }

        .rx-matrix { padding: 10px; background: var(--bg-color); }
        .rx-row { display: grid; grid-template-columns: 30px repeat(4, 1fr); gap: 6px; margin-bottom: 8px; align-items: center; }
        .rx-cell { background: var(--card-bg); border: 2px solid var(--border); border-radius: 6px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; }
        .rx-cell.active { border-color: var(--theme-color); background: var(--cell-active); }

        .numpad-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1.2fr; gap: 8px; padding: 0 10px 10px 10px; }
        .btn-n { background: #2c2c2e; color: white; border: none; border-radius: 8px; height: 50px; font-size: 22px; font-weight: 500; }
        .btn-n.dec { color: var(--theme-color); font-size: 18px; font-weight: bold; }

        .scroll-area { flex-grow: 1; padding: 10px; overflow-y: auto; background: var(--bg-color); }
        .group-title { font-size: 11px; color: var(--theme-color); font-weight: bold; margin: 15px 0 8px 0; border-bottom: 1px solid var(--border); padding-bottom: 4px; text-transform: uppercase; }
        .tag-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
        .tag { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); padding: 8px; border-radius: 6px; font-size: 11px; text-align: left; }
        .tag.active { border-color: var(--theme-color); background: var(--theme-dark); color: white; }

        .footer-section { padding: 15px; background: var(--card-bg); border-top: 1px solid var(--border); margin-bottom: 40px; }
        .score-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .s-btn { width: 30px; height: 30px; border-radius: 15px; border: 1px solid var(--border); background: var(--bg-color); color: var(--text-muted); font-size: 12px; }
        .s-btn.active { background: var(--theme-color); color: white; border-color: var(--theme-color); }
        
        textarea { width: 100%; background: #000; border: 1px solid var(--border); border-radius: 8px; color: white; padding: 10px; font-size: 14px; box-sizing: border-box; margin-top:10px; }
        .btn-sum { width: 100%; background: var(--theme-color); color: white; padding: 14px; border-radius: 8px; border: none; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body data-student="1">

<div class="app-container">
    <!-- AM / PM 分流按鈕 -->
    <div class="session-header">
        <button class="sess-btn active" id="btn-AM" onclick="setSession('AM')">☀️ AM Session</button>
        <button class="sess-btn" id="btn-PM" onclick="setSession('PM')">🌙 PM Session</button>
    </div>

    <div class="nav-header">
        <div class="tabs" id="nav-s">
            <button class="tab-btn active" id="tab-s1" onclick="setS(1)">S 1</button>
            <button class="tab-btn" id="tab-s2" onclick="setS(2)">S 2</button>
            <button class="tab-btn" id="tab-s3" onclick="setS(3)">S 3</button>
            <button class="tab-btn" id="tab-s4" onclick="setS(4)" style="display:none;">S 4</button>
            <button class="tab-btn" id="btn-add-s" onclick="addS4()" style="flex: 0.4;">➕</button>
        </div>
        <div class="patient-tabs" id="nav-p">
            <button class="p-btn active" onclick="setP(1)">🗂️ Patient 1</button>
            <button class="p-btn" onclick="setP(2)">🗂️ Patient 2</button>
        </div>
        <div class="status-banner" id="status-banner"></div>
    </div>

    <div class="info-timer-section">
        <div style="display: flex; gap: 10px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed var(--border);">
            <input type="text" id="s-name" class="info-input" placeholder="Student Name" oninput="updateStudentInfo()">
            <input type="text" id="s-group" class="info-input" style="max-width: 110px;" placeholder="Group (e.g. N1)" oninput="updateStudentInfo()">
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 10px; align-items: center;">
            <input type="text" id="p-id" class="info-input" style="flex: 1.5;" placeholder="Patient ID" oninput="updateInfo()">
            <input type="number" id="p-age" class="info-input" style="flex: 1; max-width: 70px;" placeholder="Age" oninput="updateInfo()">
            <button class="gender-btn" id="g-M" onclick="setGender('M')">M</button>
            <button class="gender-btn" id="g-F" onclick="setGender('F')">F</button>
        </div>
        
        <div style="display: flex; gap: 8px; margin-bottom: 8px;">
            <textarea id="txt-prev-hx" class="info-input" style="width:100%; height: 42px; font-size: 12px; margin: 0;" placeholder="Previous Hx..." oninput="updatePrevHx()"></textarea>
            <button class="sess-btn active" style="flex: 0 0 75px; margin: 0; padding: 0; font-size: 12px; background: #222;" onclick="setNewCase()">New Case</button>
        </div>

        <div class="timer-grid">
            <div class="t-btn" id="t-start" onclick="logTime('start')"><span class="t-lbl">Start</span><span class="t-val" id="v-start">--:--</span></div>
            <div class="t-btn" id="t-check" onclick="logTime('check')"><span class="t-lbl">Check</span><span class="t-val" id="v-check">--:--</span></div>
            <div class="t-btn" id="t-end" onclick="logTime('end')"><span class="t-lbl">Discharge</span><span class="t-val" id="v-end">--:--</span></div>
        </div>

        <button id="btn-noshow" class="btn-noshow" onclick="toggleNoShow()">🚫 Mark as No Show</button>
    </div>

    <div id="main-content-zone">
        <div class="rx-matrix">
            <div class="rx-row">
                <div class="rx-cell active" id="c-OD-sph" onclick="setF('OD','sph')"></div><div class="rx-cell" id="c-OD-cyl" onclick="setF('OD','cyl')"></div><div class="rx-cell" id="c-OD-axis" onclick="setF('OD','axis')"></div><div class="rx-cell" id="c-OD-add" onclick="setF('OD','add')"></div>
            </div>
            <div class="rx-row">
                <div class="rx-cell" id="c-OS-sph" onclick="setF('OS','sph')"></div><div class="rx-cell" id="c-OS-cyl" onclick="setF('OS','cyl')"></div><div class="rx-cell" id="c-OS-axis" onclick="setF('OS','axis')"></div><div class="rx-cell" id="c-OS-add" onclick="setF('OS','add')"></div>
            </div>
        </div>
        <div class="numpad-grid">
            <button class="btn-n" onclick="inN('7')">7</button><button class="btn-n" onclick="inN('8')">8</button><button class="btn-n" onclick="inN('9')">9</button><button class="btn-n dec" onclick="inD('.00')">.00</button>
            <button class="btn-n" onclick="inN('4')">4</button><button class="btn-n" onclick="inN('5')">5</button><button class="btn-n" onclick="inN('6')">6</button><button class="btn-n dec" onclick="inD('.25')">.25</button>
            <button class="btn-n" onclick="inN('1')">1</button><button class="btn-n" onclick="inN('2')">2</button><button class="btn-n" onclick="inN('3')">3</button><button class="btn-n dec" onclick="inD('.50')">.50</button>
            <button class="btn-n" style="color:var(--fixed-green);" onclick="tglSign()">+/-</button><button class="btn-n" onclick="inN('0')">0</button><button class="btn-n" style="background:#333;" onclick="clr()">C</button><button class="btn-n dec" onclick="inD('.75')">.75</button>
        </div>

        <div class="scroll-area">
            <div id="tags-container-main"></div>
            
            <div class="footer-section">
                <div class="group-title" style="color: #ff9f0a;">⚡ Auto-Grading Active (Click to Override)</div>
                <div class="score-row"><div>Preliminary</div><div class="score-btns" id="sc-prelim"></div></div>
                <div class="score-row"><div>Communication</div><div class="score-btns" id="sc-comm"></div></div>
                <div class="score-row"><div>Proficiency</div><div class="score-btns" id="sc-prof"></div></div>
                <div class="score-row"><div>Fluency</div><div class="score-btns" id="sc-fluency"></div></div>
                <div class="score-row"><div>Accuracy</div><div class="score-btns" id="sc-accuracy"></div></div>
                
                <textarea id="txt-note" style="min-height: 80px;" placeholder="Additional comments..."></textarea>
                <button class="btn-sum" onclick="genSum()">Copy AI Summary</button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentSession = 'AM'; // 預設 AM
    let cS = 1, cP = 1, cM = 'lens', aE = 'OD', aF = 'sph';
    let db = {};

    // Master List: Common Optometry Errors (V13 Update)
    const tagsDB = {
        '1. History & Workflow': ['Inefficient Workflow', 'Missed Chief Complaint', 'Incomplete Glauc Risks', 'Systemic Med Ignorance'],
        '2. Preliminary Tests': ['3-Sec Rule Violation', 'Incorrect Target/Env', 'Confrontation Errors', 'VA Oversights', 'Measurement Fails'],
        '3. Refraction': ['Poor Accomm Control', 'Auto-Refractor Reliance', 'Over-Minusing', 'Trial Frame/BVD Mismgmt', 'Phoropter Setup Fail', 'Near Add Errors'],
        '4. Anterior Seg & Tono': ['Incorrect Seq (GAT/Gonio)', 'Inaccurate van Herick', 'Missed Subtle Pathology', 'Tonometry Errors'],
        '5. Post Seg & Glaucoma': ['Inc. Peripheral Sweeps', 'Imaging/Dynamic Mismatch', 'Missed Disc Haems', 'Poor Stereoscopic View'],
        '6. Dx, Mgmt & Record': ['Vague Descriptions', 'Premature/Unverified Dx', 'Delayed Data Entry'],
        '7. Professionalism': ['Academic Dishonesty', 'Lack of Preparation', 'Unprofessional Comm', 'Poor Attire/Conduct']
    };

    // 自動評分扣分對應表 (該分類有錯誤，對應項目扣分)
    const gradingMap = {
        '1. History & Workflow': ['comm', 'fluency'],
        '2. Preliminary Tests': ['prelim'],
        '3. Refraction': ['prof', 'accuracy'],
        '4. Anterior Seg & Tono': ['prof', 'accuracy'],
        '5. Post Seg & Glaucoma': ['prof', 'accuracy'],
        '6. Dx, Mgmt & Record': ['prof'],
        '7. Professionalism': ['comm', 'fluency']
    };

    function init() {
        let storageKey = 'optom_v13_' + currentSession;
        db = JSON.parse(localStorage.getItem(storageKey)) || {};
        
        if (!db.settings) db.settings = { names: {1: '', 2: '', 3: '', 4: ''}, groups: {1: '', 2: '', 3: '', 4: ''}, showS4: false };

        for(let s=1;s<=4;s++) { 
            if(!db[s]) db[s]={}; 
            for(let p=1;p<=2;p++) { 
                if(!db[s][p]) db[s][p]={ 
                    pxId: '', age:'', gender:'', prevHx:'', noShow: false, times:{start:null,check:null,end:null}, 
                    lens:{OD:bRx(),OS:bRx()}, rx:{OD:bRx(),OS:bRx()}, 
                    tags:[], scores:{prelim:5, comm:5, prof:5, fluency:5, accuracy:5}, note:''
                }; 
            } 
        }
        
        let tagsHtml = '';
        for (const [category, tags] of Object.entries(tagsDB)) {
            tagsHtml += `<div class="tag-group"><div class="group-title">${category}</div><div class="tag-grid">`;
            tagsHtml += tags.map(t => `<button class="tag" onclick="tglT('${t}', '${category}')">${t}</button>`).join('');
            tagsHtml += `</div></div>`;
        }
        document.getElementById('tags-container-main').innerHTML = tagsHtml;

        ['prelim','comm','prof','fluency','accuracy'].forEach(id => {
            document.getElementById('sc-'+id).innerHTML = [1,2,3,4,5].map(n => `<button class="s-btn" onclick="setSc('${id}',${n})">${n}</button>`).join('');
        });
        
        render();
    }
    
    function bRx() { return {sph:'+',cyl:'-',axis:'',add:'+'}; }
    function save() { localStorage.setItem('optom_v13_' + currentSession, JSON.stringify(db)); }

    function setSession(sess) {
        currentSession = sess;
        document.getElementById('btn-AM').className = 'sess-btn ' + (sess=='AM'?'active':'');
        document.getElementById('btn-PM').className = 'sess-btn ' + (sess=='PM'?'active':'');
        init(); // 重新讀取對應的資料庫
    }

    function render() {
        let d = db[cS][cP];
        
        document.getElementById('tab-s4').style.display = db.settings.showS4 ? 'block' : 'none';
        document.getElementById('btn-add-s').style.display = db.settings.showS4 ? 'none' : 'block';

        for(let i=1; i<=4; i++) document.getElementById('tab-s'+i).innerText = db.settings.names[i] || ('S'+i); 
        document.getElementById('s-name').value = db.settings.names[cS];
        document.getElementById('s-group').value = db.settings.groups[cS];
        
        document.getElementById('status-banner').innerHTML = `👨‍⚕️ ${db.settings.names[cS]||'S'+cS} ➔ Patient ${cP}`;

        document.getElementById('p-id').value = d.pxId; document.getElementById('p-age').value = d.age;
        document.getElementById('g-M').className = 'gender-btn ' + (d.gender=='M'?'active':'');
        document.getElementById('g-F').className = 'gender-btn ' + (d.gender=='F'?'active':'');
        document.getElementById('txt-prev-hx').value = d.prevHx;
        
        document.getElementById('main-content-zone').style.display = d.noShow ? 'none' : 'block';
        document.getElementById('btn-noshow').className = 'btn-noshow ' + (d.noShow?'active':'');

        ['start','check','end'].forEach(k => {
            document.getElementById('v-'+k).innerText = d.times[k] ? new Date(d.times[k]).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '--:--';
            document.getElementById('t-'+k).className = 't-btn ' + (d.times[k]?'active':'');
        });

        let rx = d.rx;
        ['OD','OS'].forEach(e => ['sph','cyl','axis','add'].forEach(f => {
            let el = document.getElementById(`c-${e}-${f}`); el.innerText = rx[e][f];
            el.className = 'rx-cell ' + (e==aE && f==aF?'active ':'') + (rx[e][f].includes('-')?'val-minus':'val-plus');
        }));

        document.querySelectorAll('.tag').forEach(b => b.classList.toggle('active', d.tags.includes(b.innerText)));
        ['prelim','comm','prof','fluency','accuracy'].forEach(id => {
            document.querySelectorAll(`#sc-${id} .s-btn`).forEach((b,i)=>b.classList.toggle('active', i+1==d.scores[id]));
        });
        document.getElementById('txt-note').value = d.note;
    }

    function addS4() { db.settings.showS4 = true; save(); render(); }
    function toggleNoShow() { db[cS][cP].noShow = !db[cS][cP].noShow; save(); render(); }
    function setNewCase() { db[cS][cP].prevHx = 'New case'; save(); render(); }

    function updateStudentInfo() {
        db.settings.names[cS] = document.getElementById('s-name').value.trim();
        db.settings.groups[cS] = document.getElementById('s-group').value.trim();
        save(); render();
    }
    function updateInfo() { db[cS][cP].pxId = document.getElementById('p-id').value; db[cS][cP].age = document.getElementById('p-age').value; save(); }
    function updatePrevHx() { db[cS][cP].prevHx = document.getElementById('txt-prev-hx').value; save(); }
    function setGender(g) { db[cS][cP].gender = db[cS][cP].gender == g ? '' : g; save(); render(); }
    
    function logTime(k) { db[cS][cP].times[k] = db[cS][cP].times[k] ? null : new Date().toISOString(); save(); render(); }
    
    function setS(s) { cS = s; document.body.setAttribute('data-student', s); document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active', i==s-1)); render(); }
    function setP(p) { cP = p; document.querySelectorAll('#nav-p .p-btn').forEach((b,i)=>b.classList.toggle('active', i==p-1)); render(); }
    function setF(e,f) { aE=e; aF=f; render(); }
    
    function inN(n) { let v = db[cS][cP].rx[aE][aF]; if(aF=='axis' && v.length>=3) return; db[cS][cP].rx[aE][aF] += n; save(); render(); }
    function inD(d) { let v = db[cS][cP].rx[aE][aF]; if(aF=='axis' || v.includes('.')) return; db[cS][cP].rx[aE][aF] += (v=='+'||v=='-'?'0':'')+d; save(); render(); }
    function tglSign() { if(aF!='sph') return; let v = db[cS][cP].rx[aE][aF]; db[cS][cP].rx[aE][aF] = v.startsWith('+')?'-'+v.substring(1):'+'+v.substring(1); save(); render(); }
    function clr() { db[cS][cP].rx[aE][aF] = aF=='cyl'?'-':(aF=='axis'?'':'+'); save(); render(); }

    // Tag Toggling with Auto-Grading
    function tglT(t, category) { 
        let ts = db[cS][cP].tags; 
        if(ts.includes(t)) ts.splice(ts.indexOf(t), 1); else ts.push(t); 
        
        // 執行 Auto-Grade 邏輯
        let scores = {prelim:5, comm:5, prof:5, fluency:5, accuracy:5};
        ts.forEach(activeTag => {
            // 找出該 tag 屬於哪一類，然後扣分
            for (const [cat, tags] of Object.entries(tagsDB)) {
                if (tags.includes(activeTag) && gradingMap[cat]) {
                    gradingMap[cat].forEach(scoreField => {
                        scores[scoreField] = Math.max(1, scores[scoreField] - 1); // 扣 1 分，下限 1
                    });
                }
            }
        });
        db[cS][cP].scores = scores;
        save(); render(); 
    }
    
    function setSc(id,n) { db[cS][cP].scores[id]=n; save(); render(); }
    document.getElementById('txt-note').oninput = (e) => { db[cS][cP].note = e.target.value; save(); };

    function genSum() {
        let r = `=== Clinical Supervision Summary (${currentSession}) ===\n`;
        for(let s=1;s<=4;s++){
            if (s === 4 && !db.settings.showS4) continue;
            let stuDisplay = db.settings.groups[s] ? `${db.settings.names[s]||'S'+s} [${db.settings.groups[s]}]` : (db.settings.names[s]||'S'+s);
            r += `\n[Student: ${stuDisplay}]\n`;
            
            for(let p=1;p<=2;p++){
                let d = db[s][p];
                if (d.noShow) { r += `  Patient ${p}:\n    *** NO SHOW ***\n`; continue; }
                if(d.times.start){
                    let st = d.times.start && d.times.check ? Math.floor((new Date(d.times.check)-new Date(d.times.start))/60000) : '--';
                    r += `  Patient ${p} (ID: ${d.pxId||'?'}, ${d.age||'?'}${d.gender||'?'}):\n`;
                    if (d.prevHx) r += `    Prev Hx: ${d.prevHx}\n`;
                    r += `    Time: Stud. ${st}m\n`;
                    r += `    Grading: Prelim(${d.scores.prelim}), Comm(${d.scores.comm}), Prof(${d.scores.prof}), Fluen(${d.scores.fluency}), Accu(${d.scores.accuracy})\n`;
                    r += `    Tags: ${d.tags.join(', ') || 'None'}\n`;
                    if(d.note) r += `    Comments: ${d.note}\n`;
                }
            }
        }
        navigator.clipboard.writeText(r); alert("AI Summary copied to clipboard!");
    }

    init();
</script>
</body>
</html>
